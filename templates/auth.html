<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ '登录' if mode == 'login' else '注册' }} - 股票分析中心</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .auth-page-shell {
        width: min(460px, calc(100vw - 32px));
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: var(--shadow);
      }
      .auth-page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }
      .auth-page-header h1 {
        margin: 0;
        font-size: 1.8rem;
      }
      .brand-mark {
        width: 46px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: linear-gradient(135deg, rgba(43, 127, 255, 0.08), rgba(96, 165, 250, 0.18));
      }
      .brand-logo {
        width: 32px;
        height: 32px;
      }
      .auth-form-block {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .auth-form-block input {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 12px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--text);
      }
      .auth-actions-inline {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      .auth-actions-inline > * {
        flex: 1;
      }
      .link-line {
        margin-top: 14px;
        text-align: center;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .link-line a {
        color: var(--primary-deep);
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body data-theme="light">
    <div class="auth-page-shell">
      <div class="auth-page-header">
        <div class="brand-mark" aria-label="StockPulse logo">
          <img src="/static/images/stock-logo.svg" alt="StockPulse logo" class="brand-logo" />
        </div>
        <h1>{{ '登录' if mode == 'login' else '注册' }}</h1>
      </div>

      <form id="authForm" class="auth-form-block">
        <input id="username" type="text" placeholder="用户名" required />
        <input id="password" type="password" placeholder="密码" required />
        <div class="auth-actions-inline">
          <button type="submit" class="primary-btn">{{ '登录' if mode == 'login' else '注册' }}</button>
          <a href="/" class="ghost-btn" role="button">返回首页</a>
        </div>
      </form>

      <div class="link-line">
        {{ '还没有账号？' if mode == 'login' else '已有账号？' }}
        <a href="{{ '/register' if mode == 'login' else '/login' }}">{{ '立即注册' if mode == 'login' else '立即登录' }}</a>
      </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
      window.AUTH_MODE = {{ '"login"' if mode == 'login' else '"register"' }};
    </script>
  </body>
</html>
